    function renderIcons() {
      document.querySelectorAll('[data-lucide]').forEach((el) => {
        const name = el.getAttribute('data-lucide');
        const cls = el.getAttribute('class') || 'w-5 h-5';
        const inner = SVG_ICONS[name] || SVG_ICONS['sparkles'];
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('class', cls);
        svg.innerHTML = inner;
        el.replaceWith(svg);
      });
    }

    // =========================================================================
    // 5. UTILITAS PARSER LINK VIDEO, LIVE & KUIS EKSTERNAL
    // =========================================================================
    function parseVideoEmbedUrl(url) {
      if (!url) return '';
      const clean = url.trim();
      // YouTube standard, shorts, youtu.be
      const ytMatch = clean.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch && ytMatch[1]) {
        return `https://www.youtube.com/embed/${ytMatch[1]}?rel=0`;
      }
      // Google Drive file link
      const gdriveMatch = clean.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (gdriveMatch && gdriveMatch[1]) {
        return `https://drive.google.com/file/d/${gdriveMatch[1]}/preview`;
      }
      // Vimeo
      const vimeoMatch = clean.match(/vimeo\.com\/(\d+)/);
      if (vimeoMatch && vimeoMatch[1]) {
        return `https://player.vimeo.com/video/${vimeoMatch[1]}`;
      }
      return clean;
    }

    function parseLiveEmbedUrl(url) {
      if (!url) return '';
      const clean = url.trim();
      // YouTube Live
      const ytMatch = clean.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      if (ytMatch && ytMatch[1]) {
        return `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1`;
      }
      // Jitsi Meet (bisa langsung di-embed tanpa blokir X-Frame-Options)
      if (clean.includes('meet.jit.si')) {
        return clean.includes('#') ? clean : `${clean}#config.prejoinPageEnabled=false`;
      }
      return clean;
    }

    function parseExternalQuizUrl(url) {
      if (!url) return { embedUrl: '', platform: 'Web Kuis' };
      const clean = url.trim();
      if (clean.includes('wordwall.net')) {
        const embed = clean.replace('/resource/', '/embed/');
        return { embedUrl: embed, platform: 'Wordwall' };
      }
      if (clean.includes('quizizz.com')) {
        return { embedUrl: clean, platform: 'Quizizz' };
      }
      if (clean.includes('kahoot.it') || clean.includes('kahoot.com')) {
        return { embedUrl: clean, platform: 'Kahoot!' };
      }
      if (clean.includes('docs.google.com/forms')) {
        const embed = clean.includes('embedded=true')
          ? clean
          : (clean.includes('?') ? `${clean}&embedded=true` : `${clean}?embedded=true`);
        return { embedUrl: embed, platform: 'Google Forms' };
      }
      if (clean.includes('liveworksheets.com')) {
        return { embedUrl: clean, platform: 'Liveworksheets' };
      }
      return { embedUrl: clean, platform: 'Aplikasi Kuis Luar' };
    }

    // =========================================================================
    // 6. NOTIFIKASI TOAST & MODAL KUSTOM (PENGGANTI ALERT & CONFIRM)
    // =========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-[#251F67] text-white border-emerald-400',
        error: 'bg-rose-600 text-white border-rose-300',
        info: 'bg-indigo-600 text-white border-indigo-300'
      };
      const iconName = type === 'error' ? 'alert-circle' : (type === 'info' ? 'info' : 'check-circle-2');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-lg border-l-4 text-sm font-semibold transition-all duration-300 transform translate-x-0 ${colors[type] || colors.success}`;
      toast.innerHTML = `
        <i data-lucide="${iconName}" class="w-5 h-5 shrink-0"></i>
        <span>${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      renderIcons();
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(20px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    function openModal(htmlContent) {
      const modal = document.getElementById('modal-container');
      modal.innerHTML = `
        <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-8 fade-in relative">
          ${htmlContent}
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      renderIcons();
    }

    function closeModal() {
      const modal = document.getElementById('modal-container');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      modal.innerHTML = '';
    }

      openModal(`

          <h3 class="text-xl font-bold text-[#251F67] mb-2">${escapeHtml(title)}</h3>
          <p class="text-sm text-slate-500 mb-6">${escapeHtml(description)}</p>

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // =========================================================================
    // 7. SINKRONISASI REAL-TIME FIRESTORE (AKTIF HANYA SAAT IS_PREVIEW === false)
    // =========================================================================
    function startFirestoreListeners() {
      if (IS_PREVIEW || !fbDb) return;
      stopFirestoreListeners();

      const collectionsToWatch = [
        'users',
        'classes',
        'videos',
        'live_sessions',
        'live_messages',
        'quizzes',
        'quiz_results'
      ];

      collectionsToWatch.forEach((colName) => {
        const unsub = onSnapshot(
          collection(fbDb, colName),
          (snapshot) => {
            state[colName] = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
            // Perbarui referensi objek aktif jika sedang dibuka
            if (state.activeLiveSession) {
              const updated = state.live_sessions.find((s) => s.id === state.activeLiveSession.id);
              if (updated) state.activeLiveSession = updated;
            }
            renderApp();
          },
          (error) => {
            console.error(`Error membaca koleksi ${colName}:`, error);
          }
        );
        unsubscribers.push(unsub);
      });

      // Pantau dokumen pengaturan sekolah secara real-time
      const unsubSettings = onSnapshot(
        doc(fbDb, 'settings', 'school_profile'),
        (docSnap) => {
          if (docSnap.exists()) {
            state.schoolSettings = { ...state.schoolSettings, ...docSnap.data() };
            renderApp();
          }
        },
        (error) => {
          console.error('Error membaca pengaturan sekolah:', error);
        }
      );
      unsubscribers.push(unsubSettings);
    }

    function stopFirestoreListeners() {
      unsubscribers.forEach((fn) => fn());
      unsubscribers = [];
    }

    // Pantau sesi Firebase Auth untuk Admin saat IS_PREVIEW === false
    if (!IS_PREVIEW && fbAuth) {
      onAuthStateChanged(fbAuth, (firebaseUser) => {
        if (firebaseUser && (!state.currentUser || state.currentUser.role === 'admin')) {
          state.currentUser = {
            id: firebaseUser.uid,
            name: firebaseUser.displayName || 'Administrator Sekolah',
            username: firebaseUser.email,
            role: 'admin',
            className: 'Semua Jenjang SD/SMP'
          };
          startFirestoreListeners();
          renderApp();
        }
      });
    }

    // =========================================================================
    // 8. OPERASI CRUD HYBRID (DUAL-MODE: IN-MEMORY VS FIRESTORE)
    // =========================================================================
    async function dbAdd(colName, payload) {
      if (IS_PREVIEW) {
        const newItem = { id: `${colName}-${Date.now()}`, ...payload };
        state[colName].unshift(newItem);
        renderApp();
        return newItem;
      } else {
        const docRef = await addDoc(collection(fbDb, colName), payload);
        return { id: docRef.id, ...payload };
      }
    }

    async function dbUpdate(colName, id, payload) {
      if (IS_PREVIEW) {
        const idx = state[colName].findIndex((item) => item.id === id);
        if (idx !== -1) {
          state[colName][idx] = { ...state[colName][idx], ...payload };
        }
        renderApp();
      } else {
        await updateDoc(doc(fbDb, colName, id), payload);
      }
    }

    async function dbDelete(colName, id) {
      if (IS_PREVIEW) {
        state[colName] = state[colName].filter((item) => item.id !== id);
        renderApp();
      } else {
        await deleteDoc(doc(fbDb, colName, id));
      }
    }

    // =========================================================================
    // 9. AUTENTIKASI HYBRID (ADMIN VIA FIREBASE AUTH, GURU/SISWA VIA FIRESTORE)
    // =========================================================================
    async function handleLoginSubmit(e) {
      e.preventDefault();
      if (state.loginTab === 'admin') {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-admin-pass').value.trim();
        if (!email || !password) {
          showToast('Email dan kata sandi Admin wajib diisi.', 'error');
          return;
        }

        if (IS_PREVIEW) {
          state.currentUser = {
            id: 'admin-preview',
            name: 'Administrator Sekolah',
            username: email,
            role: 'admin',
            className: 'Semua Jenjang SD/SMP'
          };
          showToast('Berhasil masuk sebagai Administrator (Mode Preview).');
          renderApp();
          return;
        }

        try {
          state.loading = true;
          renderApp();
          const cred = await signInWithEmailAndPassword(fbAuth, email, password);
          state.currentUser = {
            id: cred.user.uid,
            name: 'Administrator Sekolah',
            username: cred.user.email,
            role: 'admin',
            className: 'Semua Jenjang SD/SMP'
          };
          startFirestoreListeners();
          showToast('Selamat datang kembali, Administrator!');
        } catch (err) {
          showToast('Login Admin gagal: Periksa email atau kata sandi Firebase Auth Anda.', 'error');
        } finally {
          state.loading = false;
          renderApp();
        }
      } else {
        // Login Peserta (Guru / Siswa) via validasi dokumen koleksi 'users'
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-user-pass').value.trim();
        if (!username || !password) {
          showToast('Username / NISN / NIP dan kata sandi wajib diisi.', 'error');
          return;
        }

        if (IS_PREVIEW) {
          const found = state.users.find(
            (u) => u.username.toLowerCase() === username.toLowerCase() && u.password === password
          );
          if (found) {
            state.currentUser = { ...found };
            showToast(`Halo, ${found.name}! Selamat belajar.`);
            renderApp();
          } else {
            showToast('Username atau kata sandi tidak ditemukan di data demo.', 'error');
          }
          return;
        }

        // Mode Produksi: Query langsung ke koleksi Firestore 'users'
        try {
          state.loading = true;
          renderApp();
          const q = query(
            collection(fbDb, 'users'),
            where('username', '==', username),
            where('password', '==', password)
          );
          const snap = await getDocs(q);
          if (snap.empty) {
            showToast('Username/NISN atau kata sandi salah. Hubungi Admin sekolah.', 'error');
          } else {
            const userDoc = snap.docs[0];
            state.currentUser = { id: userDoc.id, ...userDoc.data() };
            startFirestoreListeners();
            showToast(`Selamat datang, ${state.currentUser.name}!`);
          }
        } catch (err) {
          showToast('Gagal terhubung ke database Firestore. Periksa konfigurasi & Rules.', 'error');
        } finally {
          state.loading = false;
          renderApp();
        }
      }
    }

    async function handleLogout() {
      if (state.quizTimerInterval) clearInterval(state.quizTimerInterval);
      if (!IS_PREVIEW && fbAuth && state.currentUser?.role === 'admin') {
        try {
          await signOut(fbAuth);
        } catch (e) {}
      }
      stopFirestoreListeners();
      state.currentUser = null;
      state.activeMenu = 'beranda';
      state.activeVideo = null;
      state.activeLiveSession = null;
      state.activeQuizTake = null;
      renderApp();
      showToast('Anda telah keluar dari aplikasi.', 'info');
    }

    function renderDashboardBento() {
      const user = state.currentUser;
      const isStudent = user.role === 'siswa';

      // Filter hasil kuis untuk statistik nilai
      const relevantResults = state.quiz_results.filter((r) => {
        const matchUser = isStudent ? r.studentId === user.id : true;
        const matchQuiz = state.statsQuizFilter === 'all' ? true : r.quizId === state.statsQuizFilter;
        return matchUser && matchQuiz;
      });

      const scores = relevantResults.map((r) => Number(r.score) || 0);
      const avgScore = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
      const maxScore = scores.length ? Math.max(...scores) : null;
      const minScore = scores.length ? Math.min(...scores) : null;

      // Kategori Donut Chart (sesuai gambar referensi: >=85, 70-84, 55-69, <55)
      const countA = scores.filter((s) => s >= 85).length;
      const countB = scores.filter((s) => s >= 70 && s <= 84).length;
      const countC = scores.filter((s) => s >= 55 && s <= 69).length;
      const countD = scores.filter((s) => s < 55).length;
      const totalScores = scores.length;

      // Hitung stroke-dasharray lingkaran keliling 2 * PI * 42 ≈ 263.89
      const circumference = 263.89;
      const segA = totalScores ? (countA / totalScores) * circumference : 0;
      const segB = totalScores ? (countB / totalScores) * circumference : 0;
      const segC = totalScores ? (countC / totalScores) * circumference : 0;
      const segD = totalScores ? (countD / totalScores) * circumference : 0;

                    ${user.role !== 'siswa' ? 'GURU' : 'SERU'}
                  </span>
                </button>

                <!-- Pill 6 -->
                <button onclick="window.navigateMenu('${user.role !== 'siswa' ? 'pengaturan' : 'live'}')"
                  class="bg-white hover:bg-indigo-50/60 rounded-full p-2.5 pr-4 shadow-pill flex items-center justify-between transition group">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#EDE9FE] text-[#5B5CE6] flex items-center justify-center group-hover:scale-105 transition">
                      <i data-lucide="${user.role !== 'siswa' ? 'settings' : 'message-circle'}" class="w-4 h-4"></i>
                    </div>
                    <span class="font-bold text-sm text-[#251F67]">${user.role !== 'siswa' ? 'Pengaturan Sekolah' : 'Tanya Guru Live'}</span>
                  </div>
                  ${
                    user.role !== 'siswa'
                      ? `<span class="px-2.5 py-1 rounded-full bg-[#251F67] text-white text-[10px] font-extrabold uppercase">ADMIN</span>`
                      : ''

                </button>
              </div>
            </div>

            <!-- Kanan: Kartu Gelap Statistik Nilai (#251F67) + Donut Chart -->
            <div class="lg:col-span-5 bg-[#251F67] text-white rounded-[28px] p-6 sm:p-7 shadow-xl">
              <div class="flex items-center justify-between mb-1">
                <h2 class="text-lg font-extrabold">Statistik Nilai</h2>
                <div class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center text-indigo-200">
                  <i data-lucide="bar-chart-2" class="w-4 h-4"></i>
                </div>
              </div>

              <!-- Dropdown Filter Kuis -->
              <div class="mb-5">
                <select onchange="window.changeStatsQuizFilter(this.value)"
                  class="bg-transparent text-xs font-semibold text-indigo-200 focus:outline-none cursor-pointer pr-4">
                  <option value="all" class="text-[#251F67]" ${state.statsQuizFilter === 'all' ? 'selected' : ''}>Semua kuis</option>
                  ${state.quizzes
                    .map(
                      (q) =>
                        `<option value="${q.id}" class="text-[#251F67]" ${state.statsQuizFilter === q.id ? 'selected' : ''}>${escapeHtml(q.title)}</option>`

                    .join('')}
                </select>
              </div>

              <div class="flex items-center justify-between gap-4">
                <!-- Metrik Kiri -->
                <div class="space-y-3.5 text-xs sm:text-sm min-w-[115px]">
                  <div class="flex items-center justify-between gap-4">
                    <span class="text-indigo-200">Rata-rata</span>
                    <span class="font-extrabold">${avgScore !== null ? avgScore : '-'}</span>
                  </div>
                  <div class="flex items-center justify-between gap-4">
                    <span class="text-indigo-200">Tertinggi</span>
                    <span class="font-extrabold text-emerald-300">${maxScore !== null ? maxScore : '-'}</span>
                  </div>
                  <div class="flex items-center justify-between gap-4">
                    <span class="text-indigo-200">Terendah</span>
                    <span class="font-extrabold text-amber-300">${minScore !== null ? minScore : '-'}</span>
                  </div>
                </div>

                <!-- Donut Chart SVG Tengah -->
                <div class="relative w-28 h-28 flex items-center justify-center shrink-0">
                  <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="42" fill="none" stroke="#352D8A" stroke-width="11" />
                    ${
                      totalScores > 0
                        ? `
                          <circle cx="50" cy="50" r="42" fill="none" stroke="#38BDF8" stroke-width="11"
                            stroke-dasharray="${segA} ${circumference}" stroke-dashoffset="0" />
                          <circle cx="50" cy="50" r="42" fill="none" stroke="#FBBF24" stroke-width="11"
                            stroke-dasharray="${segB} ${circumference}" stroke-dashoffset="-${segA}" />
                          <circle cx="50" cy="50" r="42" fill="none" stroke="#A78BFA" stroke-width="11"
                            stroke-dasharray="${segC} ${circumference}" stroke-dashoffset="-${segA + segB}" />
                          <circle cx="50" cy="50" r="42" fill="none" stroke="#F43F5E" stroke-width="11"
                            stroke-dasharray="${segD} ${circumference}" stroke-dashoffset="-${segA + segB + segC}" />
                        `
                        : ''
                    }
                  </svg>
                  <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-2">
                    <span class="text-lg font-extrabold leading-none">${avgScore !== null ? avgScore : '-'}</span>
                    <span class="text-[9px] text-rose-300 font-semibold mt-1 leading-tight">
                      ${totalScores > 0 ? `${totalScores} nilai` : 'belum ada nilai'}
                    </span>
                  </div>
                </div>

                <!-- Legenda Kanan -->
                <div class="space-y-2 text-[11px] font-semibold">
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-sky-400"></span>
                    <span class="text-indigo-100">≥ 85 (${countA})</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span class="text-indigo-100">70 – 84 (${countB})</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-violet-400"></span>
                    <span class="text-indigo-100">55 – 69 (${countC})</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                    <span class="text-indigo-100">&lt; 55 (${countD})</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 13. HALAMAN 2: VIDEO BELAJAR (EMBED LINK & LANGSUNG DIPUTAR)
    // =========================================================================
    function renderVideoPage() {
      const canManage = state.currentUser.role === 'admin' || state.currentUser.role === 'guru';

      // Filter video
      const filteredVideos = state.videos.filter((v) => {
        const matchSubj = state.videoSubjectFilter === 'Semua' || v.subject === state.videoSubjectFilter;
        const matchQuery =
          !state.videoSearch ||
          v.title.toLowerCase().includes(state.videoSearch.toLowerCase()) ||
          v.subject.toLowerCase().includes(state.videoSearch.toLowerCase());
        return matchSubj && matchQuery;
      });

      const currentPlaying = state.activeVideo || filteredVideos[0] || null;

      return `
        <div class="space-y-6 fade-in">
          <!-- Header & Tombol Sematkan Video -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold text-[#251F67]">Video Pembelajaran</h1>
              <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Klik materi video di bawah untuk memutar pelajaran langsung di dalam aplikasi.</p>
            </div>
            ${
              canManage
                ? `
                  <button onclick="window.openAddVideoModal()"
                    class="px-5 py-3 rounded-full bg-[#5B5CE6] hover:bg-[#4A4BD4] text-white text-sm font-bold shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 transition">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>Sematkan Link Video</span>
                  </button>
                `
                : ''
            }
          </div>

          <!-- Pemutar Video Utama (Langsung Diputar In-App) -->
          ${
            currentPlaying
              ? `
                <div class="bg-white rounded-[28px] p-5 sm:p-7 shadow-bento grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
                  <div class="lg:col-span-8">
                    <div class="aspect-video-box shadow-md">
                      <iframe src="${escapeHtml(currentPlaying.embedUrl)}"
                        title="${escapeHtml(currentPlaying.title)}"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                        allowfullscreen></iframe>
                    </div>
                  </div>
                  <div class="lg:col-span-4 flex flex-col justify-between h-full space-y-4">
                    <div>
                      <div class="flex flex-wrap items-center gap-2 mb-3">
                        <span class="px-3 py-1 rounded-full bg-[#EDE9FE] text-[#5B5CE6] text-xs font-extrabold">
                          ${escapeHtml(currentPlaying.subject)}
                        </span>
                        <span class="px-3 py-1 rounded-full bg-[#FEF3C7] text-amber-700 text-xs font-bold">
                          ${escapeHtml(currentPlaying.className)}
                        </span>
                      </div>
                      <h2 class="text-xl font-extrabold text-[#251F67] leading-snug mb-2">
                        ${escapeHtml(currentPlaying.title)}
                      </h2>
                      <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">
                        ${escapeHtml(currentPlaying.description || 'Simak penjelasan materi video ini dengan saksama.')}
                      </p>
                    </div>
                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between">
                      <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-full bg-[#251F67] text-white flex items-center justify-center font-bold text-xs">
                          ${escapeHtml((currentPlaying.teacherName || 'G')[0])}
                        </div>
                        <div>
                          <div class="text-xs font-bold text-[#251F67]">${escapeHtml(currentPlaying.teacherName)}</div>
                          <div class="text-[11px] text-slate-400">Pengajar Materi</div>
                        </div>
                      </div>
                      ${
                        canManage
                          ? `
                            <button onclick="window.deleteVideoItem('${currentPlaying.id}')" title="Hapus Video"
                              class="p-2.5 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-600 transition">
                              <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                          `
                          : ''
                      }
                    </div>
                  </div>
                </div>
              `
              : ''
          }

          <!-- Filter Mata Pelajaran & Pencarian -->
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="flex items-center gap-2 overflow-x-auto pb-1">
              ${['Semua', ...SUBJECT_LIST]
                .map(
                  (subj) => `
                    <button onclick="window.filterVideoSubject('${subj}')"
                      class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition ${
                        state.videoSubjectFilter === subj
                          ? 'bg-[#251F67] text-white shadow-sm'
                          : 'bg-white text-slate-600 hover:bg-indigo-50'
                      }">
                      ${subj}
                    </button>
                  `
                )
                .join('')}
            </div>

            <div class="relative w-full md:w-64">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-2.5"></i>
              <input type="text" value="${escapeHtml(state.videoSearch)}" oninput="window.searchVideo(this.value)"
                placeholder="Cari judul video..."
                class="w-full pl-10 pr-4 py-2 rounded-full bg-white text-xs font-semibold text-[#251F67] shadow-sm focus:outline-none focus:ring-2 focus:ring-[#5B5CE6]" />
            </div>
          </div>

          <!-- Daftar Koleksi Video -->
          ${
            filteredVideos.length === 0
              ? `
                <div class="bg-white rounded-[28px] p-12 text-center shadow-bento">
                  <div class="w-16 h-16 rounded-full bg-[#EDE9FE] text-[#5B5CE6] flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="film" class="w-8 h-8"></i>
                  </div>
                  <h3 class="text-lg font-extrabold text-[#251F67] mb-1">Belum Ada Video Pembelajaran</h3>
                  <p class="text-sm text-slate-500 max-w-md mx-auto">
                    ${
                      canManage
                        ? 'Klik tombol "Sematkan Link Video" di atas untuk menambahkan tautan video YouTube atau Google Drive.'
                        : 'Bapak/Ibu Guru belum menambahkan video untuk kategori ini.'
                    }
                  </p>
                </div>
              `
              : `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  ${filteredVideos
                    .map((vid) => {
                      const isSelected = currentPlaying && currentPlaying.id === vid.id;
                      return `
                        <div onclick="window.selectVideoToPlay('${vid.id}')"
                          class="cursor-pointer bg-white rounded-[24px] p-5 shadow-bento border-2 transition hover:-translate-y-1 flex flex-col justify-between ${
                            isSelected ? 'border-[#5B5CE6]' : 'border-transparent'
                          }">
                          <div>
                            <div class="flex items-center justify-between gap-2 mb-3">
                              <span class="px-3 py-1 rounded-full bg-[#EDE9FE] text-[#5B5CE6] text-[11px] font-extrabold">
                                ${escapeHtml(vid.subject)}
                              </span>
                              <span class="text-[11px] font-bold text-slate-400">${escapeHtml(vid.className)}</span>
                            </div>
                            <h3 class="font-extrabold text-base text-[#251F67] line-clamp-2 mb-2">${escapeHtml(vid.title)}</h3>
                            <p class="text-xs text-slate-500 line-clamp-2 mb-4">${escapeHtml(vid.description || '')}</p>
                          </div>

                          <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-500">${escapeHtml(vid.teacherName)}</span>
                            <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold ${
                              isSelected ? 'bg-[#5B5CE6] text-white' : 'bg-[#F4F6FB] text-[#251F67]'
                            }">
                              <i data-lucide="play" class="w-3.5 h-3.5"></i>
                              <span>${isSelected ? 'Sedang Diputar' : 'Putar'}</span>
                            </span>
                          </div>
                        </div>
                      `;
                    })
                    .join('')}
                </div>
              `
          }
        </div>
      `;
    }

    // =========================================================================
    // 14. HALAMAN 3: KELAS LIVE DENGAN GURU (VIDEO LIVE + CHAT & PRESENSI)
    // =========================================================================
    function renderLivePage() {
      const canManage = state.currentUser.role === 'admin' || state.currentUser.role === 'guru';

      // Jika sedang berada di dalam ruang Live aktif
      if (state.activeLiveSession) {
        const session = state.activeLiveSession;
        const sessionMessages = state.live_messages.filter((m) => m.sessionId === session.id);
        const attendees = Array.isArray(session.attendees) ? session.attendees : [];

        return `
          <div class="space-y-5 fade-in">
            <!-- Bar Atas Ruang Live -->
            <div class="bg-white rounded-[24px] p-4 sm:p-5 shadow-bento flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <button onclick="window.leaveLiveSession()"
                  class="w-10 h-10 rounded-full bg-[#F4F6FB] hover:bg-indigo-100 text-[#251F67] flex items-center justify-center transition">
                  <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-600 text-[10px] font-extrabold uppercase">
                      ${session.status === 'live' ? '● LIVE' : session.status}
                    </span>
                    <span class="text-xs font-bold text-[#5B5CE6]">${escapeHtml(session.subject)} • ${escapeHtml(session.className)}</span>
                  </div>
                  <h1 class="text-base sm:text-lg font-extrabold text-[#251F67] mt-0.5">${escapeHtml(session.title)}</h1>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <a href="${escapeHtml(session.meetingUrl)}" target="_blank" rel="noopener noreferrer"
                  class="px-4 py-2 rounded-full bg-[#F4F6FB] hover:bg-indigo-50 text-[#251F67] text-xs font-bold flex items-center gap-1.5 transition">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  <span>Buka Tab Baru</span>
                </a>
                ${
                  canManage
                    ? `
                      <button onclick="window.toggleLiveStatus('${session.id}', '${session.status === 'live' ? 'ended' : 'live'}')"
                        class="px-4 py-2 rounded-full ${
                          session.status === 'live' ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'
                        } text-xs font-bold transition">
                        ${session.status === 'live' ? 'Akhiri Sesi Live' : 'Mulai Live Sekarang'}
                      </button>
                    `
                    : ''
                }
              </div>
            </div>

            <!-- Grid Ruang Tatap Muka Live + Panel Tanya Jawab -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <!-- Layar Video Live (8 Kolom) -->
              <div class="lg:col-span-8 space-y-4">
                <div class="bg-white rounded-[28px] p-4 shadow-bento">
                  <div class="aspect-video-box">
                    <iframe src="${escapeHtml(session.embedUrl)}"
                      allow="camera; microphone; fullscreen; display-capture; autoplay"
                      allowfullscreen></iframe>
                  </div>
                </div>

                <!-- Daftar Hadir Siswa Otomatis -->
                <div class="bg-white rounded-[24px] p-5 shadow-bento">
                  <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-extrabold text-[#251F67] flex items-center gap-2">
                      <i data-lucide="user-check" class="w-4 h-4 text-emerald-500"></i>
                      <span>Daftar Hadir Otomatis (${attendees.length} Peserta)</span>
                    </h3>
                    <span class="text-[11px] font-semibold text-slate-400">Tercatat saat bergabung</span>
                  </div>
                  <div class="flex flex-wrap gap-2">
                    ${
                      attendees.length === 0
                        ? '<span class="text-xs text-slate-400">Belum ada peserta bergabung.</span>'
                        : attendees
                            .map(
                              (name) => `
                                <span class="px-3 py-1 rounded-full bg-[#DCFCE7] text-emerald-700 text-xs font-bold">
                                  ✓ ${escapeHtml(name)}
                                </span>
                              `
                            )
                            .join('')
                    }
                  </div>
                </div>
              </div>

              <!-- Panel Diskusi & Tanya Guru Real-Time (4 Kolom) -->
              <div class="lg:col-span-4 bg-white rounded-[28px] p-5 shadow-bento flex flex-col h-[520px]">
                <div class="pb-3 border-b border-slate-100 flex items-center justify-between">
                  <h3 class="font-extrabold text-sm text-[#251F67] flex items-center gap-2">
                    <i data-lucide="message-circle" class="w-4 h-4 text-[#5B5CE6]"></i>
                    <span>Tanya Jawab Kelas</span>
                  </h3>
                  <span class="text-[11px] font-bold text-slate-400">${sessionMessages.length} pesan</span>
                </div>

                <div id="live-chat-list" class="flex-1 overflow-y-auto py-4 space-y-3">
                  ${
                    sessionMessages.length === 0
                      ? `<p class="text-xs text-slate-400 text-center my-auto py-8">Belum ada pesan. Tulis pertanyaanmu untuk guru di bawah!</p>`
                      : sessionMessages
                          .map((m) => {
                            const isGuru = m.senderRole === 'guru' || m.senderRole === 'admin';
                            return `
                              <div class="p-3 rounded-2xl ${isGuru ? 'bg-[#251F67] text-white' : 'bg-[#F4F6FB] text-[#251F67]'}">
                                <div class="flex items-center justify-between gap-2 mb-1">
                                  <span class="text-[11px] font-extrabold ${isGuru ? 'text-[#FFC374]' : 'text-[#5B5CE6]'}">
                                    ${escapeHtml(m.senderName)} ${isGuru ? '(Guru)' : ''}
                                  </span>
                                  <span class="text-[10px] opacity-60">${escapeHtml(m.createdAt || '')}</span>
                                </div>
                                <p class="text-xs leading-relaxed">${escapeHtml(m.text)}</p>
                              </div>
                            `;
                          })
                          .join('')
                  }
                </div>

                <form onsubmit="window.sendLiveMessage(event, '${session.id}')" class="pt-3 border-t border-slate-100 flex items-center gap-2">
                  <input id="live-chat-input" type="text" placeholder="Ketik pertanyaan..." required
                    class="flex-1 px-4 py-2.5 rounded-full bg-[#F4F6FB] text-xs font-semibold text-[#251F67] focus:outline-none focus:ring-2 focus:ring-[#5B5CE6]" />
                  <button type="submit"
                    class="w-10 h-10 rounded-full bg-[#5B5CE6] hover:bg-[#4A4BD4] text-white flex items-center justify-center shrink-0 transition">
                    <i data-lucide="send" class="w-4 h-4"></i>
                  </button>
                </form>
              </div>
            </div>
          </div>
        `;
      }

      // Daftar Sesi Kelas Live
      return `
        <div class="space-y-6 fade-in">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold text-[#251F67]">Kelas Live Bersama Guru</h1>
              <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Belajar tatap muka virtual dan tanya jawab langsung dengan guru.</p>
            </div>
            ${
              canManage
                ? `
                  <button onclick="window.openAddLiveModal()"
                    class="px-5 py-3 rounded-full bg-[#251F67] hover:bg-[#352D8A] text-white text-sm font-bold shadow-lg flex items-center justify-center gap-2 transition">
                    <i data-lucide="video" class="w-4 h-4 text-[#FFC374]"></i>
                    <span>Buat Jadwal Live</span>
                  </button>
                `
                : ''
            }
          </div>

          ${
            state.live_sessions.length === 0
              ? `
                <div class="bg-white rounded-[28px] p-12 text-center shadow-bento">
                  <div class="w-16 h-16 rounded-full bg-[#FEF3C7] text-amber-600 flex items-center justify-center mx-auto mb-4">

                  <h3 class="text-lg font-extrabold text-[#251F67] mb-1">Belum Ada Jadwal Kelas Live</h3>

                  </p>
                </div>
              `
              : `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                  ${state.live_sessions
                    .map((session) => {
                      const isLive = session.status === 'live';
                      const isEnded = session.status === 'ended';
                      return `
                        <div class="bg-white rounded-[28px] p-6 shadow-bento flex flex-col justify-between gap-4">
                          <div>
                            <div class="flex items-center justify-between gap-2 mb-3">
                              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-extrabold ${

                                  : isEnded
                                  ? 'bg-slate-100 text-slate-500'
                                  : 'bg-sky-100 text-sky-600'

                            <p class="text-xs font-semibold text-[#5B5CE6] mb-3">
                              ${escapeHtml(session.subject)} • ${escapeHtml(session.className)}
                            </p>
                            <div class="flex items-center gap-2 text-xs text-slate-500">
                              <i data-lucide="user" class="w-4 h-4 text-slate-400"></i>
                              <span>Pengajar: <strong>${escapeHtml(session.teacherName)}</strong></span>
                            </div>
                          </div>

                          <div class="pt-4 border-t border-slate-100 flex items-center justify-between gap-2">
                            <button onclick="window.joinLiveSession('${session.id}')"
                              class="flex-1 py-3 px-5 rounded-full ${
                                isLive ? 'bg-[#5B5CE6] hover:bg-[#4A4BD4] text-white' : 'bg-[#251F67] hover:bg-[#352D8A] text-white'
                              } text-xs font-bold transition flex items-center justify-center gap-2">
                              <i data-lucide="video" class="w-4 h-4"></i>
                              <span>${isLive ? 'Gabung Kelas Live' : 'Masuk Ruang Kelas'}</span>

                                    class="p-3 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-600 transition">

                    })

                </div>
              `
          }
        </div>
      `;

    // =========================================================================
    // 15. HALAMAN 4: KUIS & EVALUASI (MANUAL & INTEGRASI KUIS EKSTERNAL)
    // =========================================================================
    function renderQuizPage() {
      const user = state.currentUser;
      const canManage = user.role === 'admin' || user.role === 'guru';

      // Tampilan Mengerjakan Kuis (Mode Manual atau Mode Integrasi Eksternal)
      if (state.activeQuizTake) {
        const quiz = state.activeQuizTake;

        // MODE B: INTEGRASI APLIKASI KUIS EKSTERNAL (Wordwall, Quizizz, Kahoot, Google Forms)
        if (quiz.mode === 'external') {
          return `
            <div class="space-y-5 fade-in">
              <div class="bg-white rounded-[24px] p-4 sm:p-5 shadow-bento flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-3">
                  <button onclick="window.closeQuizRunner()"
                    class="w-10 h-10 rounded-full bg-[#F4F6FB] hover:bg-indigo-100 text-[#251F67] flex items-center justify-center transition">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                  </button>
                  <div>
                    <span class="px-2.5 py-0.5 rounded-full bg-[#FEF3C7] text-amber-700 text-[10px] font-extrabold uppercase">
                      Integrasi ${escapeHtml(quiz.externalPlatform || 'Kuis Luar')}
                    </span>
                    <h1 class="text-base sm:text-lg font-extrabold text-[#251F67] mt-0.5">${escapeHtml(quiz.title)}</h1>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  <a href="${escapeHtml(quiz.externalUrl)}" target="_blank" rel="noopener noreferrer"
                    class="px-4 py-2.5 rounded-full bg-[#F4F6FB] hover:bg-indigo-50 text-[#251F67] text-xs font-bold flex items-center gap-1.5 transition">
                    <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                    <span>Layar Penuh</span>
                  </a>
                  <button onclick="window.submitExternalQuizCompletion('${quiz.id}')"
                    class="px-5 py-2.5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-md transition">
                    <i data-lucide="check-circle" class="w-4 h-4"></i>
                    <span>Tandai Sudah Selesai</span>
                  </button>
                </div>
              </div>

              <div class="bg-white rounded-[28px] p-3 sm:p-4 shadow-bento">
                <div class="w-full h-[68vh] min-h-[460px] rounded-2xl overflow-hidden bg-slate-100">
                  <iframe src="${escapeHtml(quiz.embedUrl)}"
                    class="w-full h-full border-0"
                    allow="fullscreen; autoplay"
                    allowfullscreen></iframe>
                </div>
              </div>
            </div>
          `;
        }

        // MODE A: KUIS MANUAL INTERAKTIF BUILT-IN
        const questions = quiz.questions || [];
        const currentQ = questions[state.quizCurrentStep];
        const mins = Math.floor(state.quizTimerSeconds / 60);
        const secs = state.quizTimerSeconds % 60;
        const formattedTime = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

        return `
          <div class="max-w-3xl mx-auto space-y-5 fade-in">
            <!-- Header Ujian -->
            <div class="bg-white rounded-[24px] p-5 shadow-bento flex items-center justify-between gap-4">
              <div>
                <span class="text-xs font-bold text-[#5B5CE6]">${escapeHtml(quiz.subject)} • Soal ${state.quizCurrentStep + 1} dari ${questions.length}</span>
                <h1 class="text-lg font-extrabold text-[#251F67]">${escapeHtml(quiz.title)}</h1>
              </div>
              <div class="px-4 py-2 rounded-full bg-[#251F67] text-[#FFC374] font-mono font-extrabold text-sm flex items-center gap-2">
                <i data-lucide="clock" class="w-4 h-4"></i>
                <span>${formattedTime}</span>
              </div>
            </div>

            <!-- Navigasi Nomor Soal Ramah SD/SMP -->
            <div class="flex flex-wrap gap-2">
              ${questions
                .map((_, idx) => {
                  const answered = state.quizAnswers[idx] !== undefined;
                  const isCurrent = idx === state.quizCurrentStep;
                  return `
                    <button onclick="window.jumpQuizStep(${idx})"
                      class="w-10 h-10 rounded-full text-xs font-extrabold transition ${
                        isCurrent
                          ? 'bg-[#251F67] text-white ring-4 ring-indigo-200'
                          : answered
                          ? 'bg-emerald-500 text-white'
                          : 'bg-white text-slate-600 hover:bg-indigo-50'
                      }">
                      ${idx + 1}
                    </button>
                  `;
                })
                .join('')}
            </div>

            <!-- Kartu Pertanyaan Besar -->
            ${
              currentQ
                ? `
                  <div class="bg-white rounded-[28px] p-6 sm:p-8 shadow-bento space-y-6">
                    <div class="text-base sm:text-lg font-extrabold text-[#251F67] leading-relaxed">
                      ${state.quizCurrentStep + 1}. ${escapeHtml(currentQ.question)}
                    </div>

                    <div class="space-y-3">
                      ${(currentQ.options || [])
                        .map((opt, optIdx) => {
                          const letters = ['A', 'B', 'C', 'D'];
                          const isSelected = state.quizAnswers[state.quizCurrentStep] === optIdx;
                          return `
                            <button type="button" onclick="window.selectQuizOption(${state.quizCurrentStep}, ${optIdx})"
                              class="w-full text-left p-4 rounded-2xl border-2 transition flex items-center gap-4 ${
                                isSelected
                                  ? 'border-[#5B5CE6] bg-[#EDE9FE]/50 text-[#251F67]'
                                  : 'border-slate-100 bg-[#F4F6FB]/60 hover:bg-[#F4F6FB] text-slate-700'
                              }">
                              <span class="w-9 h-9 rounded-full flex items-center justify-center font-extrabold text-sm shrink-0 ${
                                isSelected ? 'bg-[#5B5CE6] text-white' : 'bg-white text-[#251F67] shadow-sm'
                              }">
                                ${letters[optIdx]}
                              </span>
                              <span class="font-bold text-sm sm:text-base">${escapeHtml(opt)}</span>
                            </button>
                          `;
                        })
                        .join('')}
                    </div>

                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between gap-3">
                      <button type="button" onclick="window.prevQuizStep()" ${state.quizCurrentStep === 0 ? 'disabled' : ''}
                        class="px-5 py-2.5 rounded-full bg-slate-100 disabled:opacity-40 text-[#251F67] text-xs font-bold transition">
                        ← Sebelumnya
                      </button>

                      ${
                        state.quizCurrentStep < questions.length - 1
                          ? `
                            <button type="button" onclick="window.nextQuizStep()"
                              class="px-6 py-2.5 rounded-full bg-[#251F67] hover:bg-[#352D8A] text-white text-xs font-bold transition">
                              Selanjutnya →
                            </button>
                          `
                          : `
                            <button type="button" onclick="window.finishManualQuiz()"
                              class="px-6 py-3 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold shadow-lg transition flex items-center gap-2">
                              <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                              <span>Selesai & Lihat Nilai</span>
                            </button>
                          `
                      }
                    </div>
                  </div>
                `
                : ''
            }
          </div>
        `;
      }

      // Daftar Kuis & Riwayat Nilai
      const filteredQuizzes = state.quizzes.filter(
        (q) => state.quizSubjectFilter === 'Semua' || q.subject === state.quizSubjectFilter
      );

      return `
        <div class="space-y-6 fade-in">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold text-[#251F67]">Kuis & Evaluasi Belajar</h1>
              <p class="text-xs sm:text-sm text-slate-500 mt-0.5">Kerjakan kuis pilihan ganda langsung atau kuis interaktif dari Wordwall, Quizizz, & Kahoot.</p>
            </div>
            ${
              canManage
                ? `
                  <button onclick="window.openAddQuizModal()"
                    class="px-5 py-3 rounded-full bg-[#5B5CE6] hover:bg-[#4A4BD4] text-white text-sm font-bold shadow-lg shadow-indigo-200 flex items-center justify-center gap-2 transition">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>Buat / Sematkan Kuis</span>
                  </button>
                `
                : ''
            }
          </div>

          <!-- Filter Mapel -->
          <div class="flex items-center gap-2 overflow-x-auto pb-1">
            ${['Semua', ...SUBJECT_LIST]
              .map(
                (subj) => `
                  <button onclick="window.filterQuizSubject('${subj}')"
                    class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap transition ${
                      state.quizSubjectFilter === subj
                        ? 'bg-[#251F67] text-white shadow-sm'
                        : 'bg-white text-slate-600 hover:bg-indigo-50'
                    }">
                    ${subj}
                  </button>
                `
              )
              .join('')}
          </div>

          <!-- Grid Daftar Kuis -->
          ${
            filteredQuizzes.length === 0
              ? `
                <div class="bg-white rounded-[28px] p-12 text-center shadow-bento">
                  <div class="w-16 h-16 rounded-full bg-[#E0F2FE] text-sky-500 flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="clipboard-check" class="w-8 h-8"></i>
                  </div>
                  <h3 class="text-lg font-extrabold text-[#251F67] mb-1">Belum Ada Kuis Tersedia</h3>
                  <p class="text-sm text-slate-500 max-w-md mx-auto">
                    ${
                      canManage
                        ? 'Klik tombol "Buat / Sematkan Kuis" untuk menginput soal manual atau menempelkan link kuis dari aplikasi luar.'
                        : 'Belum ada kuis yang dibagikan oleh guru pada mata pelajaran ini.'
                    }
                  </p>
                </div>
              `
              : `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  ${filteredQuizzes
                    .map((q) => {
                      const isExternal = q.mode === 'external';
                      const myResult = state.quiz_results.find(
                        (r) => r.quizId === q.id && (user.role === 'siswa' ? r.studentId === user.id : true)
                      );
                      return `
                        <div class="bg-white rounded-[26px] p-6 shadow-bento flex flex-col justify-between gap-4">
                          <div>
                            <div class="flex items-center justify-between gap-2 mb-3">
                              <span class="px-3 py-1 rounded-full text-[11px] font-extrabold ${
                                isExternal
                                  ? 'bg-[#FEF3C7] text-amber-700'
                                  : 'bg-[#EDE9FE] text-[#5B5CE6]'
                              }">
                                ${isExternal ? `🔗 ${escapeHtml(q.externalPlatform || 'Kuis Luar')}` : `📝 Kuis Manual (${(q.questions || []).length} Soal)`}
                              </span>
                              <span class="text-[11px] font-bold text-slate-400">${q.durationMinutes || 10} Menit</span>
                            </div>

                            <h3 class="text-base font-extrabold text-[#251F67] mb-1">${escapeHtml(q.title)}</h3>
                            <p class="text-xs font-semibold text-slate-500 mb-3">${escapeHtml(q.subject)} • ${escapeHtml(q.className)}</p>

                            ${
                              user.role === 'siswa' && myResult
                                ? `
                                  <div class="p-3 rounded-2xl bg-[#DCFCE7] text-emerald-800 text-xs font-bold flex items-center justify-between">
                                    <span>Nilai Kamu:</span>
                                    <span class="text-base font-extrabold">${myResult.score}</span>
                                  </div>
                                `
                                : ''
                            }
                          </div>

                          <div class="pt-3 border-t border-slate-100 flex items-center gap-2">
                            <button onclick="window.startQuiz('${q.id}')"
                              class="flex-1 py-3 px-4 rounded-full bg-[#251F67] hover:bg-[#352D8A] text-white text-xs font-bold transition flex items-center justify-center gap-2">
                              <i data-lucide="play-circle" class="w-4 h-4 text-[#FFC374]"></i>
                              <span>${isExternal ? 'Buka Kuis Interaktif' : 'Mulai Kerjakan'}</span>
                            </button>
                            ${
                              canManage
                                ? `
                                  <button onclick="window.deleteQuizItem('${q.id}')" title="Hapus Kuis"
                                    class="p-3 rounded-full bg-rose-50 hover:bg-rose-100 text-rose-600 transition">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                  </button>
                                `
                                : ''
                            }
                          </div>
                        </div>
                      `;
                    })
                    .join('')}
                </div>
              `
          }
        </div>
      `;
    }

                              <td class="py-3.5 px-4 text-right">

              <span>Tambah Kelas</span>
            </button>

                    .map(

                              c.level === 'SD' ? 'bg-[#FEF3C7] text-amber-700' : 'bg-[#E0F2FE] text-sky-700'

                            <h4 class="font-extrabold text-sm text-[#251F67] mt-1">${escapeHtml(c.name)}</h4>

    window.handleLogoUpload = (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showToast('Pilih file gambar (PNG, JPG, WebP, atau SVG).', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = async () => {
          // Kompresi & ubah ukuran maksimal 240x240px agar ringan disimpan langsung di Firestore
          const maxDim = 240;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const optimizedDataUrl = canvas.toDataURL('image/png', 0.9);

          state.schoolSettings.logoDataUrl = optimizedDataUrl;
          if (!IS_PREVIEW && fbDb && state.currentUser?.role === 'admin') {
            await setDoc(doc(fbDb, 'settings', 'school_profile'), { logoDataUrl: optimizedDataUrl }, { merge: true });
          }
          showToast('Logo sekolah berhasil diunggah & diperbarui!');
          renderApp();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

              <span>Mode Uji Coba (Preview) — Data berjalan sementara di memori browser.</span>
            </span>
            <span class="hidden sm:inline text-[11px] text-amber-800">Ubah IS_PREVIEW = false saat deploy</span>
          </div>
        `
        : '';

      appEl.innerHTML = `
        <div class="min-h-screen bg-[#F4F6FB]">
          ${renderNavigation()}
          <main class="md:pl-20 pb-24 md:pb-10">
            <div class="max-w-[1380px] mx-auto px-4 sm:px-7 pt-5 sm:pt-7">
              ${topPreviewStrip}
              ${activeViewHtml}
            </div>
          </main>
        </div>
      `;

      renderIcons();
    }

    // Jalankan render perdana
    renderApp();
  </script>
</body>
</html>
